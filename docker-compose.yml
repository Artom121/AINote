services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgres://assistant:assistant@db:5432/assistant
    depends_on:
      db: { condition: service_healthy }

  # Фоновые задачи (pg-boss): очистка корзины и др.
  worker:
    build: { context: ., target: migrator }
    command: ["pnpm", "worker"]
    environment:
      DATABASE_URL: postgres://assistant:assistant@db:5432/assistant
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  app:
    build: { context: ., target: runner }
    env_file: .env
    environment:
      DATABASE_URL: postgres://assistant:assistant@db:5432/assistant
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
